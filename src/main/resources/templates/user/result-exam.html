<!-- result.html -->
<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Kết quả bài thi</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/user/result-exam.css">
</head>

<body class="bg-light">

  <div sec:authorize="hasRole('USER')"
          th:replace="~{fragments/navbar-user :: navbarUser}">
  </div>

  <div class="container py-5">

    <div class="result-card mx-auto">

      <div class="text-center mb-4">

        <div class="score-circle" id="scoreCircle">
          0
        </div>

        <h2 class="fw-bold mt-3 mb-1">
          Hoàn thành bài thi
        </h2>

        <p class="text-muted">
          Kết quả bài làm của bạn
        </p>

      </div>

      <div class="row g-3">

        <div class="col-md-6">
          <div class="info-box">
            <div class="label">Điểm số</div>
            <div class="value text-primary" id="score">
              0
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="info-box">
            <div class="label">Số câu đúng</div>
            <div class="value text-success" id="correctCount">
              0
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="info-box">
            <div class="label">Tổng số câu</div>
            <div class="value" id="totalQuestions">
              0
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="info-box">
            <div class="label">Trạng thái</div>
            <div class="value text-info" id="status">
              COMPLETED
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="info-box">
            <div class="label">Thời gian nộp bài</div>
            <div class="value fs-6" id="finishedAt">
              --
            </div>
          </div>
        </div>

      </div>

      <div class="text-center mt-4">

        <a href="/"
                class="btn btn-primary px-4">
          Quay lại danh sách đề
        </a>

      </div>

    </div>

  </div>

  <script src="/js/user/result-exam.js"></script>
</body>
</html>
