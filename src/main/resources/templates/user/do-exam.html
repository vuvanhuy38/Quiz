<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Làm bài thi</title>

  <link rel="stylesheet" href="/css/user/do-exam.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div id="exam-taking-app">

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-content">
        <div class="spinner-border text-primary mb-3" role="status">
          <span class="visually-hidden">Đang tải...</span>
        </div>
        <p class="text-muted">Đang chuẩn bị đề thi...</p>
      </div>
    </div>

    <!-- Exam Screen (hidden initially) -->
    <div id="exam-screen" style="display: none;">

      <!-- Fixed Header -->
      <header class="exam-header">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center justify-content-between">

            <div class="exam-title-wrap">
              <span class="badge bg-primary-subtle text-primary-emphasis me-2">Đang làm bài</span>
              <span id="exam-title-header" class="fw-semibold text-truncate">Đề thi</span>
            </div>

            <div class="d-flex align-items-center gap-3">

              <div class="timer-box" id="timer-box">
                <i class="bi bi-clock me-1"></i>
                <span id="timer-display">--:--</span>
              </div>

              <button class="btn btn-danger btn-sm px-3" onclick="confirmSubmit()">
                Nộp bài
              </button>

            </div>

          </div>
        </div>
      </header>

      <!-- Main Layout -->
      <div class="exam-layout container-fluid px-0">

        <!-- Question Panel -->
        <main class="question-panel" id="question-panel">
          <div class="px-4 py-4" id="questions-container">
            <!-- Questions rendered by JS -->
          </div>

          <div class="submit-area px-4 pb-5">
            <button class="btn btn-primary px-5 py-2 fw-semibold" onclick="confirmSubmit()">
              Nộp bài
            </button>
          </div>
        </main>

        <!-- Sidebar: Question Navigator -->
        <aside class="question-sidebar">
          <div class="sidebar-inner">

            <div class="sidebar-header">
              <span class="fw-semibold">Câu hỏi</span>
              <span class="text-muted" id="progress-text">0 / 0</span>
            </div>

            <div class="question-grid" id="question-grid">
              <!-- Grid buttons rendered by JS -->
            </div>

            <div class="sidebar-legend mt-3">
              <div class="legend-item">
                <span class="legend-dot answered"></span>
                <span>Đã trả lời</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot unanswered"></span>
                <span>Chưa trả lời</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot current"></span>
                <span>Câu hiện tại</span>
              </div>
            </div>

          </div>
        </aside>

      </div>

    </div>

    <!-- Confirm Submit Modal -->
    <div class="modal fade" id="submitModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Xác nhận nộp bài</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="submit-summary" class="text-muted mb-0"></p>
          </div>
          <div class="modal-footer border-0 pt-0">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Quay lại</button>
            <button type="button" class="btn btn-danger fw-semibold px-4" onclick="submitExam()">Nộp bài ngay</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Error Screen -->
    <div id="error-screen" style="display: none;" class="loading-screen">
      <div class="loading-content text-center">
        <div class="text-danger fs-1 mb-3">&#9888;</div>
        <h5 class="fw-bold">Không thể tải đề thi</h5>
        <p class="text-muted" id="error-message">Vui lòng thử lại sau.</p>
        <a href="/exams" class="btn btn-outline-primary mt-2">Quay lại danh sách đề</a>
      </div>
    </div>

  </div>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/user/do-exam.js"></script>

</body>
</html>
