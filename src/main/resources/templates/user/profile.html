<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thông tin tài khoản - Quiz App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/user/profile.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <div sec:authorize="hasRole('USER')" th:replace="~{fragments/navbar-user :: navbarUser}"></div>

  <div class="container py-5">
    
    <!-- Alert Messages -->
    <div id="alertContainer" class="d-none">
      <div id="alertBox" class="alert alert-dismissible fade show" role="alert">
        <span id="alertMessage"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>

    <div class="row g-4">
      
      <!-- Sidebar Card (Thông tin tổng quan) -->
      <div class="col-lg-4">
        <div class="glass-card p-4 text-center">
          <div class="avatar-container mb-3">
            <div id="avatarCircle" class="avatar-circle">-</div>
          </div>
          <h4 id="displayFullName" class="fw-bold mb-1">-</h4>
          <p id="displayUsername" class="text-muted mb-2">@username</p>
          <div class="mb-3">
            <span id="displayRole" class="role-badge role-user">USER</span>
          </div>
          <hr class="my-4">
          <div class="text-start">
            <div class="d-flex justify-content-between mb-2">
              <span class="text-muted">Email:</span>
              <span id="sidebarEmail" class="fw-medium text-break">-</span>
            </div>
            <div class="d-flex justify-content-between">
              <span class="text-muted">Điện thoại:</span>
              <span id="sidebarPhone" class="fw-medium">-</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Content Cards (Form chỉnh sửa và đổi mật khẩu) -->
      <div class="col-lg-8">
        
        <!-- Chỉnh sửa thông tin -->
        <div class="glass-card p-4 mb-4">
          <h4 class="card-title fw-bold mb-4">Thông tin cá nhân</h4>
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="lastName" class="form-label">Họ</label>
                <input type="text" class="form-control" id="lastName" required placeholder="Nhập họ của bạn">
              </div>
              <div class="col-md-6">
                <label for="firstName" class="form-label">Tên</label>
                <input type="text" class="form-control" id="firstName" required placeholder="Nhập tên của bạn">
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Địa chỉ Email</label>
                <input type="email" class="form-control" id="email" required placeholder="example@email.com">
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Số điện thoại</label>
                <input type="tel" class="form-control" id="phone" placeholder="Nhập số điện thoại">
              </div>
            </div>
            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary btn-save-profile">Lưu thay đổi</button>
            </div>
          </form>
        </div>

        <!-- Đổi mật khẩu -->
        <div class="glass-card p-4">
          <h4 class="card-title password-title fw-bold mb-4">Đổi mật khẩu</h4>
          <form id="passwordForm">
            <div class="mb-3">
              <label for="oldPassword" class="form-label">Mật khẩu hiện tại</label>
              <input type="password" class="form-control" id="oldPassword" required placeholder="Nhập mật khẩu cũ">
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="newPassword" class="form-label">Mật khẩu mới</label>
                <input type="password" class="form-control" id="newPassword" required placeholder="Tối thiểu 6 ký tự">
              </div>
              <div class="col-md-6">
                <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                <input type="password" class="form-control" id="confirmPassword" required placeholder="Nhập lại mật khẩu mới">
              </div>
            </div>
            <div class="text-end">
              <button type="submit" class="btn btn-success btn-change-password">Cập nhật mật khẩu</button>
            </div>
          </form>
        </div>

      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/user/profile.js"></script>
</body>
</html>
