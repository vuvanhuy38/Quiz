<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết bài làm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/user/attempt_history.css">
</head>
<body class="bg-light">

  <div sec:authorize="hasRole('USER')" th:replace="~{fragments/navbar-user :: navbarUser}"></div>

  <div class="container py-5">
    <div class="glass-card mb-4 p-4">
      <h2 class="fw-bold mb-3" id="detailExamTitle">Tên bài thi</h2>
      <div class="row text-center mb-3">
        <div class="col-md-3">
          <h5>Điểm số</h5>
          <h3 class="text-primary" id="detailScore">-</h3>
        </div>
        <div class="col-md-3">
          <h5>Điểm tối đa</h5>
          <h3 class="text-secondary" id="detailMaxScore">-</h3>
        </div>
        <div class="col-md-3">
          <h5>Trạng thái</h5>
          <h3 id="detailStatus">-</h3>
        </div>
        <div class="col-md-3">
          <h5>Thời gian làm</h5>
          <h3 id="detailDuration">-</h3>
        </div>
      </div>
      <a href="/user/history" class="btn btn-outline-secondary">Quay lại danh sách</a>
    </div>

    <!-- Questions Details Area -->
    <div class="glass-card p-4">
      <h4 class="fw-bold mb-3">Chi tiết các câu hỏi</h4>
      <div id="questionsContainer" class="d-flex flex-column gap-4 mt-3"></div>
    </div>
  </div>

  <script src="/js/user/attempt_detail.js"></script>
</body>
</html>
