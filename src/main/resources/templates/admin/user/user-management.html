<!DOCTYPE html>
<html lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <title>Quản lý người dùng</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="/css/admin/layout.css">
  <link rel="stylesheet" href="/css/admin/user/user-management.css">
</head>

<body>

  <div sec:authorize="hasRole('ADMIN')"
          th:replace="~{fragments/navbar-admin :: navbarAdmin}">
  </div>

  <div class="main-content">

    <div th:replace="~{fragments/topbar-admin :: topbarAdmin('Quản lý người dùng')}">
    </div>

    <div class="user-content">
      <div class="container-fluid">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h3 class="fw-bold">Danh sách người dùng</h3>
            <p class="text-muted mb-0">Quản lý tài khoản hệ thống</p>
          </div>
        </div>

        <!-- Filter -->
        <div class="card filter-card shadow-sm mb-4">
          <div class="card-body">
            <div class="row g-3">

              <div class="col-md-4">
                <div class="search-box">
                  <i class="bi bi-search"></i>
                  <input type="text" id="nameSearch" class="form-control"
                          placeholder="Tìm theo tên...">
                </div>
              </div>

              <div class="col-md-3">
                <input type="text" id="emailSearch" class="form-control"
                        placeholder="Email...">
              </div>

              <div class="col-md-3">
                <input type="text" id="phoneSearch" class="form-control"
                        placeholder="Số điện thoại...">
              </div>

              <div class="col-md-2">
                <button class="btn btn-dark w-100" id="filterBtn">
                  Lọc
                </button>
              </div>

            </div>
          </div>
        </div>

        <!-- Table -->
        <div class="card table-card shadow-sm">

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
              <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Role</th>
                <th>Status</th>
                <th class="text-center">Hành động</th>
              </tr>
              </thead>

              <tbody id="userTableBody"></tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="d-flex justify-content-between align-items-center mt-3 p-3">

            <div id="tableInfo" class="text-muted small"></div>

            <ul class="pagination custom-pagination mb-0" id="pagination"></ul>

          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="/js/admin/user/user-management.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
