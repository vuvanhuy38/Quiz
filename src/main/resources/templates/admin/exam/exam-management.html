<!DOCTYPE html>
<html lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">
    <title>Quản lý đề thi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/exam/exam-management.css">


</head>

<body>

    <div sec:authorize="hasRole('ADMIN')"
            th:replace="~{fragments/navbar-admin :: navbarAdmin}">
    </div>

    <div class="main-content">

        <div th:replace="~{fragments/topbar-admin :: topbarAdmin('Quản lý đề thi')}">
        </div>

        <div class="exam-content">

            <div class="container-fluid">

                <!-- Header Action -->
                <div class="top-action d-flex justify-content-between align-items-center mb-4">

                    <div>
                        <h3 class="fw-bold mb-1">Danh sách đề thi</h3>
                        <p class="text-muted mb-0">Quản lý toàn bộ đề thi trong hệ thống</p>
                    </div>

                    <button class="btn btn-primary create-btn"
                            onclick="window.location.href='/admin/exams/create'">
                        <i class="bi bi-plus-circle"></i>
                        Tạo đề thi
                    </button>

                </div>

                <!-- Search + Filter -->
                <div class="card filter-card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="row g-3">

                            <div class="col-md-4">
                                <div class="search-box">
                                    <i class="bi bi-search"></i>
                                    <input type="text" id="searchInput" class="form-control"
                                            placeholder="Tìm kiếm đề thi...">
                                </div>
                            </div>

                            <div class="col-md-3">
                                <select class="form-select" id="categoryFilter">
                                    <option value="">Tất cả danh mục</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <select class="form-select" id="sortFilter">
                                    <option value="createdAt,desc">Mới nhất</option>
                                    <option value="createdAt,asc">Cũ nhất</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <select class="form-select" id="statusFilter">
                                    <option value="">Tất cả trạng thái</option>
                                    <option value="ACTIVE">Hoạt động</option>
                                    <option value="INACTIVE">Ẩn</option>
                                </select>
                            </div>

                            <div class="col-md-1">
                                <button class="btn btn-dark w-100" id="filterBtn">Lọc</button>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- Table -->
                <div class="card table-card shadow-sm">

                    <div class="table-responsive">

                        <table class="table align-middle mb-0">

                            <thead>
                            <tr>
                                <th>STT</th>
                                <th>Tên đề thi</th>
                                <th>Danh mục</th>
                                <th>Số câu hỏi</th>
                                <th>Thời gian</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th class="text-center">Hành động</th>
                            </tr>
                            </thead>

                            <tbody id="examTableBody">
                            <!-- JS render -->
                            </tbody>
                        </table>
                    </div>


                    <div class="d-flex justify-content-between align-items-center mt-3">

                        <div id="tableInfo" class="text-muted small">
                            <!-- ví dụ: 1 - 10 / 100 -->
                        </div>

                        <ul class="pagination custom-pagination mb-0" id="pagination"></ul>

                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="/js/admin/exam/exam-management.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
