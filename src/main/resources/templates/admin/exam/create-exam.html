<!DOCTYPE html>
<html lang="vi"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="UTF-8">

    <title>Tạo đề thi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/exam/create-exam.css">

</head>

<body>

    <div sec:authorize="hasRole('ADMIN')"
            th:replace="~{fragments/navbar-admin :: navbarAdmin}">
    </div>

    <div class="main-content">

        <div th:replace="~{fragments/topbar-admin :: topbarAdmin('Quản lý đề thi')}"></div>

        <div class="exam-create-wrapper">

            <div class="container-fluid">

                <div class="page-card">

                    <!-- TABS -->
                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <!-- TABS -->
                        <div class="custom-tabs d-flex gap-3">

                            <div class="custom-tab active" id="tabInfo">
                                <i class="bi bi-file-earmark-text"></i>
                                Thông tin đề
                            </div>

                            <div class="custom-tab disabled" id="tabQuestion">
                                <i class="bi bi-list-task"></i>
                                Câu hỏi
                                <span class="badge bg-secondary" id="questionCount">0</span>
                            </div>

                        </div>

                        <!-- BACK BUTTON -->
                        <a href="/admin/exams"
                           class="btn btn-outline-secondary btn-sm">

                            <i class="bi bi-arrow-left"></i>
                            Trở về

                        </a>

                    </div>

                    <!-- INFO -->
                    <div id="infoSection">

                        <input type="hidden"
                                id="examId">

                        <div class="row g-4">

                            <div class="col-12">

                                <label>Tiêu đề *</label>

                                <input type="text"
                                        class="form-control"
                                        id="title">

                            </div>

                            <div class="col-md-6">

                                <label>Danh mục cha</label>

                                <select class="form-select"
                                        id="parentCategory">
                                </select>

                            </div>

                            <div class="col-md-6">

                                <label>Danh mục con</label>

                                <select class="form-select"
                                        id="childCategory"
                                        disabled>
                                </select>

                            </div>

                            <div class="col-12">

                                <label>Mô tả</label>

                                <textarea class="form-control"
                                        id="description"
                                        rows="4">
                                </textarea>

                            </div>

                            <div class="col-md-6">

                                <label>Thời gian</label>

                                <input type="number"
                                        class="form-control"
                                        id="timeLimit">

                            </div>

                            <div class="col-md-6">

                                <label>Trạng thái</label>

                                <select class="form-select"
                                        id="status">

                                    <option value="ACTIVE">
                                        ACTIVE
                                    </option>

                                    <option value="INACTIVE">
                                        INACTIVE
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="mt-3">

                            <button class="btn btn-dark"
                                    id="saveExamBtn">

                                Lưu đề thi

                            </button>

                        </div>

                    </div>

                    <!-- QUESTION -->
                    <div id="questionSection"
                            style="display:none">

                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <h4 class="mb-0">
                                Danh sách câu hỏi
                            </h4>

                            <div class="d-flex gap-2 flex-wrap">

                                <button class="btn btn-dark"
                                        id="btnAddManual">

                                    <i class="bi bi-plus-circle"></i>

                                    Thêm thủ công

                                </button>

                                <button class="btn btn-outline-dark"
                                        id="btnImportBank">

                                    <i class="bi bi-database-add"></i>

                                    Import Question Bank

                                </button>

                                <button class="btn btn-success"
                                        id="btnSaveQuestions">

                                    <i class="bi bi-check-circle"></i>

                                    Lưu câu hỏi

                                </button>

                            </div>

                        </div>

                        <div id="questionList">

                            <div class="alert alert-secondary">
                                Chưa có câu hỏi
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- MODAL -->
    <div class="modal fade"
            id="addQuestionModal"
            tabindex="-1">

        <div class="modal-dialog modal-xl">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Thêm câu hỏi
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <!-- CONTENT -->
                    <div class="mb-3">

                        <label class="form-label">
                            Nội dung câu hỏi
                        </label>

                        <textarea class="form-control"
                                id="questionContent"
                                rows="3">
                        </textarea>

                    </div>

                    <!-- TYPE + LEVEL -->
                    <div class="row">

                        <div class="col-md-6">

                            <label class="form-label">
                                Loại câu hỏi
                            </label>

                            <select class="form-select"
                                    id="questionType">

                                <option value="SINGLE_CHOICE">
                                    SINGLE_CHOICE
                                </option>

                                <option value="MULTIPLE_CHOICE">
                                    MULTIPLE_CHOICE
                                </option>

                                <option value="TRUE_FALSE">
                                    TRUE_FALSE
                                </option>

                            </select>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">
                                Độ khó
                            </label>

                            <select class="form-select"
                                    id="questionLevel">

                                <option value="EASY">
                                    EASY
                                </option>

                                <option value="MEDIUM">
                                    MEDIUM
                                </option>

                                <option value="HARD">
                                    HARD
                                </option>

                            </select>

                        </div>

                    </div>

                    <hr>

                    <!-- OPTIONS -->
                    <div id="optionsContainer">

                    </div>

                    <!-- ADD OPTION -->
                    <div class="mt-3">

                        <button class="btn btn-outline-dark"
                                type="button"
                                id="btnAddOption">

                            <i class="bi bi-plus-circle"></i>

                            Thêm đáp án

                        </button>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary"
                            data-bs-dismiss="modal">

                        Đóng

                    </button>

                    <button class="btn btn-dark"
                            id="btnSaveManualQuestion">

                        Lưu câu hỏi

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/admin/exam/create-exam.js"></script>

</body>

</html>
