<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin đề thi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .nav-tabs .nav-link {
            border: none;
            border-bottom: 3px solid transparent;
            color: #666;
            font-weight: 500;
            padding: 12px 20px;
        }
        .nav-tabs .nav-link.active {
            color: #0d6efd;
            border-bottom: 3px solid #0d6efd;
            background: none;
        }
        .info-banner {
            background-color: #e7f3ff;
            border: 1px solid #b3d4ff;
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 0.95rem;
        }
        .form-label {
            font-weight: 500;
            color: #333;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 14px;
            border: 1px solid #ced4da;
        }
        .required::after {
            content: " *";
            color: #dc3545;
        }
        .btn {
            border-radius: 8px;
            padding: 10px 20px;
            font-weight: 500;
        }
        .bottom-buttons {
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Tabs -->
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link active" href="#"><i class="bi bi-info-circle"></i> Thông tin đề</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#">Câu hỏi <span class="badge bg-primary">3</span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#"><i class="bi bi-bank"></i> Ngân hàng đề</a>
            </li>
        </ul>

        <!-- Info Banner -->
        <div class="info-banner mb-4">
            <i class="bi bi-info-circle-fill text-primary"></i>
            Đây là form tạo/cập nhật đề thi. Gọi <strong>POST /exam</strong> (tạo mới) hoặc <strong>PUT /exam/:id</strong> (cập nhật).
        </div>

        <div class="row">
            <div class="col-lg-8">

                <!-- Tiêu đề đề thi -->
                <div class="mb-4">
                    <label class="form-label required">Tiêu đề đề thi</label>
                    <input type="text" class="form-control" value="Kiểm tra cuối kỳ môn Lập trình Web" placeholder="Nhập tiêu đề đề thi">
                </div>

                <!-- Mô tả -->
                <div class="mb-4">
                    <label class="form-label">Mô tả</label>
                    <textarea class="form-control" rows="4" placeholder="Mô tả đề thi...">Bài kiểm tra đánh giá kiến thức HTML, CSS, JavaScript và React.</textarea>
                </div>

                <div class="row">
                    <!-- Thời gian -->
                    <div class="col-md-6 mb-4">
                        <label class="form-label required">Thời gian (phút)</label>
                        <input type="number" class="form-control" value="60">
                    </div>

                    <!-- Trạng thái -->
                    <div class="col-md-6 mb-4">
                        <label class="form-label">Trạng thái</label>
                        <select class="form-select">
                            <option selected>Draft — chưa công khai</option>
                            <option>Published — công khai</option>
                            <option>Archived</option>
                        </select>
                    </div>
                </div>

                <!-- Bottom Buttons -->
                <div class="bottom-buttons d-flex gap-3">
                    <button class="btn btn-outline-secondary">
                        <i class="bi bi-question-circle"></i> Hỏi về status
                    </button>
                    <button class="btn btn-primary">
                        <i class="bi bi-save"></i> Lưu đề thi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
