<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/category/category-management.css">
</head>

<body>

<div sec:authorize="hasRole('ADMIN')"
     th:replace="~{fragments/navbar-admin :: navbarAdmin}">
</div>

<div class="main-content">

    <div th:replace="~{fragments/topbar-admin :: topbarAdmin('Quản lý danh mục')}"></div>

    <div class="category-content">
        <div class="container-fluid">

            <!-- HEADER -->
            <div class="top-action d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold mb-1">Danh sách danh mục</h3>
                    <p class="text-muted mb-0">Quản lý danh mục cha và danh mục con</p>
                </div>
                <button class="btn btn-primary create-btn"
                        data-bs-toggle="modal"
                        data-bs-target="#createCategoryModal">
                    <i class="bi bi-plus-circle"></i>
                    Thêm danh mục
                </button>
            </div>

            <!-- FILTER -->
            <div class="card filter-card shadow-sm mb-4">
                <div class="card-body">
                    <div class="row g-3">

                        <div class="col-md-7">
                            <div class="search-box">
                                <i class="bi bi-search"></i>
                                <input type="text"
                                       id="searchInput"
                                       class="form-control"
                                       placeholder="Tìm kiếm danh mục...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <select class="form-select" id="sortFilter">
                                <option value="createdAt,desc">Mới nhất</option>
                                <option value="createdAt,asc">Cũ nhất</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <button class="btn btn-dark w-100" id="filterBtn">Lọc</button>
                        </div>

                    </div>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card table-card shadow-sm">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên danh mục</th>
                            <th>Mô tả</th>
                            <th>Loại</th>
                            <th>Danh mục cha</th>
                            <th>Số danh mục con</th>
                            <th class="text-center">Hành động</th>
                        </tr>
                        </thead>
                        <tbody id="categoryTableBody"></tbody>
                    </table>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3 p-3">
                    <div id="tableInfo" class="text-muted small"></div>
                    <ul class="pagination custom-pagination mb-0" id="pagination"></ul>
                </div>

            </div>

        </div>
    </div>

    <!-- MODAL TẠO DANH MỤC -->
    <div class="modal fade" id="createCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Thêm danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                        <input type="text" id="categoryName" class="form-control" placeholder="Nhập tên danh mục">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea id="categoryDescription" class="form-control" rows="3" placeholder="Nhập mô tả"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Danh mục cha</label>
                        <select id="categoryParent" class="form-select">
                            <option value="">Không có (là danh mục cha)</option>
                        </select>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btnSaveCategory">Lưu</button>
                </div>

            </div>
        </div>
    </div>

    <!-- MODAL UPDATE DANH MỤC -->
    <div class="modal fade" id="updateCategoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật danh mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">

                    <div class="mb-3">
                        <label class="form-label">Tên danh mục <span class="text-danger">*</span></label>
                        <input type="text" id="updateCategoryName" class="form-control" placeholder="Nhập tên danh mục">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Mô tả</label>
                        <textarea id="updateCategoryDescription" class="form-control" rows="3" placeholder="Nhập mô tả"></textarea>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" id="btnUpdateCategory">Cập nhật</button>
                </div>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/admin/category/category-management.js"></script>

</body>
</html>
