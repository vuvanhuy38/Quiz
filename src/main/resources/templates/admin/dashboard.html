<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | Web Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin/layout.css">
    <link rel="stylesheet" href="/css/admin/dashboard.css">
</head>

<body>

    <div sec:authorize="hasRole('ADMIN')"
            th:replace="~{fragments/navbar-admin :: navbarAdmin}">
    </div>

    <div class="main-content">

        <div th:replace="~{fragments/topbar-admin :: topbarAdmin('Dashboard Thống kê')}">
        </div>

        <div class="dashboard-content">
            <div class="container-fluid">

                <!-- ── 5 Statistic Cards ── -->
                <div class="row g-3 mb-4 row-cols-1 row-cols-sm-2 row-cols-xl-5">

                    <div class="col">
                        <div class="card dashboard-card card-blue h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="card-label mb-1">Người dùng</p>
                                    <h3 class="card-value fw-bold mb-0" id="statUsers">
                                        <span class="spinner-border spinner-border-sm" role="status"></span>
                                    </h3>
                                </div>
                                <div class="icon-box">
                                    <i class="bi bi-people-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card dashboard-card card-green h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="card-label mb-1">Đề thi</p>
                                    <h3 class="card-value fw-bold mb-0" id="statExams">
                                        <span class="spinner-border spinner-border-sm" role="status"></span>
                                    </h3>
                                </div>
                                <div class="icon-box">
                                    <i class="bi bi-file-earmark-text-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card dashboard-card card-orange h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="card-label mb-1">Danh mục</p>
                                    <h3 class="card-value fw-bold mb-0" id="statCategories">
                                        <span class="spinner-border spinner-border-sm" role="status"></span>
                                    </h3>
                                </div>
                                <div class="icon-box">
                                    <i class="bi bi-tags-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card dashboard-card card-purple h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="card-label mb-1">Lượt làm bài</p>
                                    <h3 class="card-value fw-bold mb-0" id="statAttempts">
                                        <span class="spinner-border spinner-border-sm" role="status"></span>
                                    </h3>
                                </div>
                                <div class="icon-box">
                                    <i class="bi bi-trophy-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col">
                        <div class="card dashboard-card card-pink h-100">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <p class="card-label mb-1">Câu hỏi</p>
                                    <h3 class="card-value fw-bold mb-0" id="statQuestions">
                                        <span class="spinner-border spinner-border-sm" role="status"></span>
                                    </h3>
                                </div>
                                <div class="icon-box">
                                    <i class="bi bi-question-circle-fill"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- ── Chart + Table Row ── -->
                <div class="row g-3">

                    <!-- Biểu đồ xu hướng 7 ngày -->
                    <div class="col-lg-7">
                        <div class="card section-card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="fw-bold mb-0">Xu hướng thi cử</h6>
                                    <p class="text-muted small mb-0">Lượt làm bài trong 7 ngày qua</p>
                                </div>
                                <div class="chart-icon bg-primary-subtle text-primary">
                                    <i class="bi bi-graph-up-arrow"></i>
                                </div>
                            </div>
                            <div class="card-body">
                                <canvas id="trendChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Bảng lượt thi gần đây -->
                    <div class="col-lg-5">
                        <div class="card section-card h-100">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h6 class="fw-bold mb-0">Lượt thi gần đây</h6>
                                <span class="badge bg-primary-subtle text-primary rounded-pill">Mới nhất</span>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-custom align-middle mb-0">
                                        <thead>
                                            <tr>
                                                <th class="ps-3">Thành viên</th>
                                                <th>Đề thi</th>
                                                <th class="text-center">Điểm</th>
                                                <th class="pe-3 text-end">Thời gian</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recentAttemptsTable">
                                            <tr>
                                                <td colspan="4" class="text-center py-4 text-muted">
                                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                                    Đang tải...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/admin/dashboard.js"></script>
</body>
</html>
