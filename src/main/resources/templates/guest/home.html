<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Quiz App</title>

    <link rel="stylesheet" href="/css/home.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Guest -->
    <div sec:authorize="isAnonymous()"
            th:replace="~{fragments/navbar-guest :: navbarGuest}">
    </div>

    <!-- User -->
    <div sec:authorize="hasRole('USER')"
            th:replace="~{fragments/navbar-user :: navbarUser}">
    </div>

    <section class="hero">
        <div class="container text-center">
            <h1>Hệ thống thi trắc nghiệm online</h1>
            <p class="mt-3 fs-5">
                Luyện tập kiến thức và tham gia các bài kiểm tra nhanh chóng
            </p>
            <div class="search-box mt-4">
                <div class="input-group input-group-lg">
                    <input type="text" id="searchInput" class="form-control" placeholder="Tìm kiếm đề thi...">
                    <button class="btn btn-light" id="searchBtn">
                        Tìm kiếm
                    </button>
                </div>
            </div>
        </div>
    </section>

    <div class="container my-5">

        <section id="featured">
            <h2 class="section-title">Đề thi nổi bật</h2>
            <div class="row g-4" id="featuredExams">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
        </section>

        <section class="mt-5" id="latestSection">
            <h2 class="section-title">Đề thi mới nhất</h2>
            <div class="row g-4" id="latestExams">
                <div class="loading">Đang tải dữ liệu...</div>
            </div>
        </section>

        <!-- Section kết quả tìm kiếm, mặc định ẩn -->
        <section id="searchResults" style="display: none;">
            <h2 class="section-title">Kết quả tìm kiếm</h2>
            <div class="row g-4" id="searchResultExams"></div>
        </section>

    </div>

    <footer class="footer">
        <div class="container">
            © 2026 Quiz App - Hệ thống thi trắc nghiệm
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/js/guest/home.js"></script>

</body>
</html>
