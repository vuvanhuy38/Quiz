<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="card shadow p-4" style="width: 450px;">

            <h3 class="text-center mb-4">Đăng ký tài khoản</h3>

            <div id="message"></div>

            <form id="registerForm" autocomplete="off">

                <!-- Username -->
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>

                    <input type="text" id="username" class="form-control" placeholder="Nhập username">

                    <small class="text-danger" id="usernameError"></small>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email" id="email" class="form-control" placeholder="Nhập email">

                    <small class="text-danger" id="emailError"></small>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>

                    <input type="text" id="phone" class="form-control" placeholder="Nhập số điện thoại">
                </div>

                <!-- Họ tên cùng hàng -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Họ</label>

                        <input type="text" id="firstName" class="form-control" placeholder="Nhập họ">

                        <small class="text-danger" id="firstNameError"></small>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Tên</label>

                        <input type="text" id="lastName" class="form-control" placeholder="Nhập tên">

                        <small class="text-danger" id="lastNameError"></small>
                    </div>

                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>

                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu">

                    <small class="text-danger" id="passwordError"></small>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Đăng ký
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/login">Đã có tài khoản? Đăng nhập</a>
            </div>

        </div>
    </div>

    <script src="/js/guest/register.js"></script>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }, 20);
        });
    </script>

</body>
</html>
